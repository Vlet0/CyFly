[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flycyborg"
version = "0.1.0"
description = "Drosophila connectome controller for wheeled robot indoor navigation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    "ai2thor==5.0.0",
    "opencv-python>=4.8",
]
evo = [
    "cma>=3.3",
]
viz = [
    "matplotlib>=3.7",
]
all = [
    "ai2thor==5.0.0",
    "opencv-python>=4.8",
    "cma>=3.3",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
]

[project.scripts]
flycyborg = "flycyborg.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flycyborg*"]

[tool.ruff]
line-length = 100
target-version = "py310"
